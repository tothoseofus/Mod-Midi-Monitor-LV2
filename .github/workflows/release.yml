name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check VERSION matches tag
        run: python3 tools/stamp_version.py

  arm64:
    needs: validate
    uses: ./.github/workflows/build.yml

  desktop:
    needs: validate
    uses: ./.github/workflows/build-desktop.yml

  publish:
    name: Package and publish release
    needs: [arm64, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: v*-pistomp-midi-probe-*-${{ github.run_number }}
          path: downloaded
      - name: Verify artifacts and prepare release ZIPs
        run: |
          python3 tools/package_release.py --tag "$GITHUB_REF_NAME" --run-number "$GITHUB_RUN_NUMBER"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME. Refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --verify-tag
