
name: Investigate MODEP Atom Support

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out MODEP source
        run: |
          git clone --depth 1 \
            https://github.com/TreeFallSound/mod-ui.git

          git clone --depth 1 \
            https://github.com/TreeFallSound/mod-host.git

      - name: Inspect Atom and Patch handling
        shell: bash
        run: |
          mkdir -p results

          {
            echo "=== MODEP Atom Support Investigation ==="
            echo
            echo "MOD-UI commit:"
            git -C mod-ui rev-parse HEAD
            echo
            echo "MOD-HOST commit:"
            git -C mod-host rev-parse HEAD
            echo

            echo "=== Host Atom/Patch references ==="
            grep -RniE \
              'patch_get|patch_set|atom:|LV2_ATOM|atom_out|atom_output' \
              mod-host/src \
              | head -n 180 || true

            echo
            echo "=== MOD-UI event handling ==="
            grep -RniE \
              'patch_get|patch_set|monitor_output|monitoredOutputs|atom:eventTransfer|atom_out' \
              mod-ui/mod mod-ui/html mod-ui/server.py \
              | head -n 220 || true

            echo
            echo "=== MOD GUI JavaScript callbacks ==="
            grep -RniE \
              'eventTransfer|patch:Set|patch:Put|event.type|event.symbol|parameterChange' \
              mod-ui/html mod-ui/mod \
              | head -n 180 || true

          } > results/modep-atom-report.txt 2>&1

      - name: Upload investigation report
        uses: actions/upload-artifact@v4
        with:
          name: modep-atom-investigation
          path: results/
