
<div class="mod-pedal mod-pistomp-midi-probe">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="probe-content">
        <div class="probe-title">piStomp MIDI Monitor</div>
        <div class="probe-subtitle">MIDI input monitor</div>

        <div class="probe-line">
            Messages: <strong class="probe-count">0</strong>
        </div>

        <div class="probe-line">
            Last bytes: <span class="probe-bytes">00 00 00</span>
        </div>

        <div class="probe-help">
            Counts incoming MIDI events
        </div>
        
        <div class="probe-log-title">MIDI MESSAGE HISTORY</div>
<!--
        <div class="probe-log"></div>
-->
        <textarea class="probe-log"
          readonly
          spellcheck="false"
          title="Click here, then Ctrl+A and Ctrl+C to copy MIDI messages"></textarea>
        
        <div class="probe-log-footer">
            Waiting for MIDI...
        </div>

    </div>

    <div class="probe-io probe-in">
        <div class="mod-input"
             mod-role="input-midi-port"
             mod-port-symbol="midi_in"
             title="MIDI Input"></div>
    </div>

</div>
