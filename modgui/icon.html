<div class="mod-pedal mod-pistomp-midi-probe">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="probe-content">
        <div class="probe-title">piStomp MIDI Monitor</div>
        <div class="probe-subtitle">MIDI input monitor</div>

        <div class="probe-line">
            Messages: <strong class="probe-count">0</strong>
        </div>

        <!-- Native disclosure widget; closed by default to maximise history space. -->
        <details class="probe-diagnostics">
            <summary class="probe-diagnostics-toggle">Diagnostics</summary>
            <div class="probe-diagnostics-body">
                <div class="probe-line">Last bytes: <span class="probe-bytes">00 00 00</span></div>
                <div class="probe-line">Atom/Patch: <span class="probe-atom-status">Waiting...</span></div>
                <div class="probe-line">C batches emitted: <strong class="probe-batch-count">0</strong></div>
                <div class="probe-log-footer">Waiting for MIDI...</div>
            </div>
        </details>

        <details class="probe-filters" aria-label="MIDI display filters">
            <summary class="probe-filters-toggle">Display Filters</summary>
            <div class="probe-filters-body">
            <div class="probe-filter-head">
                <span>DISPLAY FILTERS</span>
                <label>Channel
                    <select class="probe-channel-filter" title="Show all channels or one MIDI channel">
                        <option value="0">All</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                    </select>
                </label>
                <label>Format
                    <select class="probe-display-mode" title="Display format (Copy All always exports full history)">
                        <option value="both">Both</option>
                        <option value="hex">Hex</option>
                        <option value="decoded">Decoded</option>
                    </select>
                </label>
            </div>
            <div class="probe-filter-categories">
                <label><input type="checkbox" class="probe-filter-checkbox" value="noteOn" checked> Note On</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="noteOff" checked> Note Off</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="cc" checked> CC</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="pc" checked> PC</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="bend" checked> Bend</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="aftertouch" checked> Aftertouch</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="sysex" checked> SysEx</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="system" checked> System</label>
                <label><input type="checkbox" class="probe-filter-checkbox" value="other" checked> Other</label>
            </div>
            </div>
        </details>

        <div class="probe-log-title">MIDI MESSAGE HISTORY</div>
        
        <textarea class="probe-log"
                  readonly
                  spellcheck="false"
                  title="MIDI message history"></textarea>
        
        
        
        
        <div class="probe-actions">
            <button type="button" class="probe-copy-btn">
                Copy All
            </button>
        
            <button type="button" class="probe-clear-btn">
                Clear Log
            </button>

            <button type="button" class="probe-follow-btn">
                Follow Latest
            </button>

            <span class="probe-copy-status"></span>
        </div>


        <div class="probe-history-nav">
            <button type="button" class="probe-older-btn">Older 300</button>
            <button type="button" class="probe-newer-btn">Newer 300</button>
        </div>
        <div class="probe-review-status"></div>
    </div>

    <div class="probe-io probe-in">
        <div class="mod-input"
             mod-role="input-midi-port"
             mod-port-symbol="midi_in"
             title="MIDI Input"></div>
    </div>

</div>
