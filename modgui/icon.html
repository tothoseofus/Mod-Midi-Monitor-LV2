<div class="mod-pedal mod-pistomp-midi-probe">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="probe-content">
        <div class="probe-title">piStomp MIDI Monitor</div>
        <div class="probe-subtitle">MIDI input monitor</div>

        <div class="probe-line">
            Messages: <strong class="probe-count">0</strong>
        </div>

        <div class="probe-line">
            Last bytes: <span class="probe-bytes">00 00 00</span>
        </div>

        <div class="probe-help">
            Live MIDI event monitor
        </div>
            
        <div class="probe-line">
            Atom/Patch:
           <span class="probe-atom-status">Waiting...</span>
        </div>

        <div class="probe-line">
            C batches emitted:
            <strong class="probe-batch-count">0</strong>
        </div>
        
        <div class="probe-log-title">MIDI MESSAGE HISTORY</div>
        
        <textarea class="probe-log"
                  readonly
                  spellcheck="false"
                  title="MIDI message history"></textarea>
        
        <div class="probe-log-footer">
            Waiting for MIDI...
        </div>

        
        
        
        <div class="probe-actions">
            <button type="button" class="probe-copy-btn">
                Copy All
            </button>
        
            <button type="button" class="probe-clear-btn">
                Clear Log
            </button>

            <button type="button" class="probe-follow-btn">
                Follow Latest
            </button>

            <span class="probe-copy-status"></span>
        </div>


        <div class="probe-history-nav">
            <button type="button" class="probe-older-btn">Older 300</button>
            <button type="button" class="probe-newer-btn">Newer 300</button>
        </div>
        <div class="probe-review-status"></div>
    </div>

    <div class="probe-io probe-in">
        <div class="mod-input"
             mod-role="input-midi-port"
             mod-port-symbol="midi_in"
             title="MIDI Input"></div>
    </div>

</div>
